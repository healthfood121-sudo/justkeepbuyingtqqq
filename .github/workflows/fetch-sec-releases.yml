name: 실적 발표문 받기 (SEC, 조사용)

on:
  workflow_dispatch:  # 결과는 로그로만 확인 (커밋 없음)
    inputs:
      ticker:
        description: '종목 티커'
        required: true
      limit:
        description: '최근 몇 개까지'
        required: false
        default: '40'
      brief:
        description: '발표문당 글자 수(비우면 전체 14000자)'
        required: false
        default: ''
      annual:
        description: '1이면 연간 숫자가 든 발표문만'
        required: false
        default: ''
      form:
        description: '서류 종류(8-K 또는 해외 회사 6-K)'
        required: false
        default: '8-K'
      pattern:
        description: '이 정규식이 든 문서만, 찾은 위치부터'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python scripts/fetch_sec_releases.py "${{ inputs.ticker }}" "${{ inputs.limit }}"
        env:
          PYTHONUNBUFFERED: "1"
          BRIEF: ${{ inputs.brief }}
          ANNUAL: ${{ inputs.annual }}
          FORM: ${{ inputs.form }}
          PATTERN: ${{ inputs.pattern }}
