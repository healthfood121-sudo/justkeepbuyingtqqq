name: 나스닥100 일별 종가 자동 업데이트

on:
  schedule:
    # 미국장 마감 후: 화~토 KST 07:00 (UTC 22:00 월~금)
    - cron: '0 22 * * 1-5'
    # 재시도: 화~토 KST 10:30 (UTC 01:30 화~토) — 이미 반영됐으면 변경 없음
    - cron: '30 1 * * 2-6'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 종가 업데이트
        run: python scripts/update_ndx_prices.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ndx_1971_now.csv web/public/ndx.csv

          if git diff --cached --quiet; then
            echo "변경사항 없음 — 스킵"
          else
            LAST=$(tail -n 1 web/public/ndx.csv | cut -d, -f1)
            git commit -m "auto: 나스닥100 종가 업데이트 ${LAST}"
            git pull --rebase
            git push
            echo "✅ 커밋 & 푸시 완료"
          fi
