name: 인출식 매매 신호 업데이트

on:
  schedule:
    # 미국 장 마감 후 매일 KST 07:30 (UTC 22:30, 월~금 미국 거래일 기준 화~토)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      test_notify:
        description: '텔레그램 알림 테스트 (지금 상태를 바로 한 번 보냄)'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: LOC 환산식 검증
        run: python scripts/export_withdrawal_signal.py --selftest --offline

      - name: 직전 신호 보관 (알림 비교용)
        run: cp web/public/data/withdrawal_signal.json /tmp/prev_signal.json || true

      - name: 신호 계산
        run: python scripts/export_withdrawal_signal.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add web/public/data/withdrawal_signal.json

          if git diff --cached --quiet; then
            echo "변경사항 없음 — 스킵"
          else
            ASOF=$(python -c "import json;print(json.load(open('web/public/data/withdrawal_signal.json'))['asof'])")
            git commit -m "auto: 인출식 매매 신호 업데이트 ${ASOF}"
            git push
          fi

      # 텔레그램 알림 — 저장소 Secrets(TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)가 없으면 아무것도 보내지 않음.
      # 알림이 실패해도 신호 업데이트는 이미 끝났으므로 워크플로는 성공으로 둔다.
      - name: 텔레그램 알림
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python scripts/notify_telegram.py --test
          else
            python scripts/notify_telegram.py --prev /tmp/prev_signal.json
          fi
