name: 지수 구성 종목 (iShares ETF SEC 보유 종목 보고서)

on:
  workflow_dispatch:
    inputs:
      etf:
        description: 'IWM(러셀2000) 또는 IJH(S&P 미드캡 400)'
        required: false
        default: 'IWM'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python scripts/fetch_russell2000.py ${{ inputs.etf }}
        env:
          PYTHONUNBUFFERED: "1"
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data/*.json
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 스킵"
          else
            git commit -m "auto: ${{ inputs.etf }} 구성 종목 $(date +'%Y-%m-%d')"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
