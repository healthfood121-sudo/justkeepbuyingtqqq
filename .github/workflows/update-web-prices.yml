name: 시뮬레이터 가격 데이터 최신화 (매달)

on:
  schedule:
    # 매달 2일 KST 09:00 (UTC 00:00) — 전달 말까지의 종가와 금리를 반영
    - cron: '0 0 2 * *'
  push:
    branches: [master]
    paths:
      - 'scripts/update_web_prices.py'
      - '.github/workflows/update-web-prices.yml'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 가격·금리 덧붙이기 (data/ 원본은 그대로, web/public 사본만)
        run: python scripts/update_web_prices.py

      - name: 실제 ETF 가격 받기 (TQQQ·QLD·QQQ — real_vs_synthetic 입력)
        run: |
          python - <<'EOF'
          # FRED(환율·물가)는 이 워크플로에서 불필요 — Yahoo ETF/NDX만 받음
          import io, sys, time
          from pathlib import Path
          import pandas as pd, requests

          OUT_DIR = Path("data/extra")
          OUT_DIR.mkdir(parents=True, exist_ok=True)
          UA = {"User-Agent": "Mozilla/5.0"}
          YAHOO = {"TQQQ": "tqqq", "QLD": "qld", "QQQ": "qqq", "^NDX": "ndx_yahoo"}

          def fetch_yahoo(symbol):
              url = (f"https://query1.finance.yahoo.com/v8/finance/chart/{requests.utils.quote(symbol)}"
                     f"?period1=0&period2={int(time.time())}&interval=1d&events=div,split&includeAdjustedClose=true")
              for i in range(4):
                  try:
                      res = requests.get(url, headers=UA, timeout=30).json()["chart"]["result"][0]
                      q = res["indicators"]["quote"][0]
                      adj = res["indicators"].get("adjclose", [{}])[0].get("adjclose") or q["close"]
                      df = pd.DataFrame({
                          "Date": pd.to_datetime(res["timestamp"], unit="s").tz_localize("UTC").tz_convert("America/New_York").date,
                          "Close": q["close"], "AdjClose": adj,
                      }).dropna().drop_duplicates("Date", keep="last")
                      return df
                  except Exception as e:
                      if i == 3: raise
                      print(f"  재시도 {i+1}: {e}"); time.sleep(2**(i+1))

          failed = []
          for sym, name in YAHOO.items():
              try:
                  df = fetch_yahoo(sym)
                  df.to_csv(OUT_DIR / f"{name}.csv", index=False)
                  print(f"{sym}: {len(df)}행 {df.Date.iloc[0]} ~ {df.Date.iloc[-1]}")
              except Exception as e:
                  failed.append(sym); print(f"[실패] {sym}: {e}", file=sys.stderr)

          if failed:
              sys.exit(f"실패: {failed}")
          EOF

      - name: NDX 원본(data/ndx_1971_now.csv) 최신화
        run: |
          python - <<'EOF'
          import csv
          from pathlib import Path

          src = Path("data/extra/ndx_yahoo.csv")
          dst = Path("data/ndx_1971_now.csv")

          # 기존 마지막 날짜 파악
          with open(dst) as f:
              rows = list(csv.reader(f))
          last_date = rows[-1][0] if rows else ""

          # src에서 그 이후 행만 추출 (헤더 제외)
          with open(src) as f:
              new_rows = [r for r in csv.reader(f) if r[0] > last_date and r[0] != "Date"]

          if new_rows:
              with open(dst, "a", newline="") as f:
                  w = csv.writer(f)
                  for r in new_rows:
                      w.writerow([r[0], r[1]])  # Date, Close
              print(f"추가: {len(new_rows)}행 ({new_rows[0][0]} ~ {new_rows[-1][0]})")
          else:
              print("추가할 새 데이터 없음")
          EOF

      - name: 연도별 수익률 비교 데이터 생성 (real_vs_synthetic.json)
        run: python scripts/real_vs_synthetic.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/ndx.csv web/public/sp500.csv web/public/data/fed_funds_rate.json data/extra data/ndx_1971_now.csv web/public/data/real_vs_synthetic.json
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 스킵"
          else
            git commit -m "auto: 시뮬레이터 가격 데이터 최신화 $(date +'%Y-%m-%d')"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
