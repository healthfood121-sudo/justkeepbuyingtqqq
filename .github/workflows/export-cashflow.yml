name: 전 종목 현금흐름·자본 수익률

on:
  workflow_dispatch:  # 수동 실행
    inputs:
      tickers:
        description: '일부 종목만 (공백 구분, 비우면 전 종목)'
        required: false
        default: ''
      commit:
        description: '결과 커밋 여부 (false면 로그만)'
        required: false
        default: 'true'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas
      - run: python scripts/export_cashflow.py ${{ inputs.tickers }}
        env:
          PYTHONUNBUFFERED: "1"
      - name: 커밋 & 푸시
        if: ${{ inputs.commit == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/fundamentals/
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "auto: 전 종목 현금흐름·자본 수익률"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
