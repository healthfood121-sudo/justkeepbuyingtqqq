name: 롤링 분석 데이터 주간 업데이트

on:
  schedule:
    # 매주 일요일 KST 03:00 (UTC 18:00 토요일)
    - cron: '0 18 * * 6'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180  # 최대 3시간

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 롤링 CSV + JSON 전체 재생성
        run: |
          python scripts/generate_all_sp500.py --force-csv --force-json
        env:
          PYTHONUNBUFFERED: "1"

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add scripts/data/rolling/
          git add web/public/data/rolling/

          if git diff --cached --quiet; then
            echo "변경사항 없음 — 스킵"
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "auto: 롤링 분석 데이터 업데이트 ${DATE}"
            git pull --rebase origin master
            git push origin HEAD:master
            echo "✅ 커밋 & 푸시 완료"
          fi
