name: S&P 500 지수 10년 보유·EPS 분해 (쉴러 데이터)

on:
  workflow_dispatch:  # 실행한 브랜치에 SPX_rolling.json을 커밋한다

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas xlrd
      - run: python scripts/export_sp500_rolling.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/rolling/SPX_rolling.json
          git diff --cached --quiet || git commit -m "auto: S&P 500 지수 10년 보유·EPS 분해 $(date -u +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
