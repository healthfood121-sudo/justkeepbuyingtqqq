name: SEC 이전 EPS 채우기

on:
  workflow_dispatch:  # 수동 실행
    inputs:
      tickers:
        description: '일부 종목만 (공백 구분, 비우면 전 종목)'
        required: false
        default: ''
      commit:
        description: '결과를 커밋할지 (yes/no)'
        required: false
        default: 'yes'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/export_eps_pre2008.py --shard=${{ matrix.shard }}/4 ${{ inputs.tickers }}
        env:
          PYTHONUNBUFFERED: "1"
      - name: 커밋 & 푸시
        if: ${{ inputs.commit == 'yes' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/fundamentals/
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "auto: SEC 이전 EPS 채우기 (${{ matrix.shard }}/4)"
            for i in 1 2 3 4 5 6; do
              git pull --rebase origin master && git push origin HEAD:master && break
              sleep $((i * 10))
            done
          fi
