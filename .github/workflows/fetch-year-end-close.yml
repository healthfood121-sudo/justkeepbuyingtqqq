name: 연말 실제 종가 받기 (로그 출력만)

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: '야후 티커 목록 (공백 구분)'
        required: true
        default: 'AAPL KO'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas yfinance
      - run: python scripts/fetch_year_end_close.py ${{ inputs.tickers }}
        env:
          PYTHONUNBUFFERED: "1"
