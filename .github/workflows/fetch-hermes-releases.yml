name: 에르메스 매출 보도자료 수집

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests && sudo apt-get install -y poppler-utils
      - run: python scripts/fetch_hermes_releases.py
        env:
          PYTHONUNBUFFERED: "1"
          HERMES_DEBUG: "1"
      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data/hermes_releases
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "auto: 에르메스 매출 보도자료 텍스트"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
